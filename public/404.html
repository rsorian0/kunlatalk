<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Kunlatalk</title>
  <!--
    Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
    Redireciona qualquer rota inexistente de volta para o index.html,
    preservando o caminho para o React Router resolver no carregamento.

    pathSegmentsToKeep = 1  -> projeto comum (usuario.github.io/REPOSITORIO/)
    pathSegmentsToKeep = 0  -> dominio proprio OU repositorio usuario.github.io
  -->
  <script type="text/javascript">
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
